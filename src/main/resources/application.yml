spring:
  application:
    name: tourism
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tourism}
    username: ${SPRING_DATASOURCE_USERNAME:tourism}
    password: ${SPRING_DATASOURCE_PASSWORD:tourism}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-min-32-chars-long}
  expiration: ${JWT_EXPIRATION:86400000}

admin:
  email: ${ADMIN_EMAIL:admin@tamaka.com}
  password: ${ADMIN_PASSWORD:Admin123!}
  full-name: ${ADMIN_FULL_NAME:System Administrator}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

storage:
  r2:
    account-id: ${R2_ACCOUNT_ID:${IDENTITY_R2_ACCOUNT_ID:}}
    access-key-id: ${R2_ACCESS_KEY_ID:${IDENTITY_R2_ACCESS_KEY_ID:}}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:${IDENTITY_R2_SECRET_ACCESS_KEY:}}
    bucket: ${R2_BUCKET:${IDENTITY_R2_BUCKET:}}
    endpoint: ${R2_ENDPOINT:${IDENTITY_R2_ENDPOINT:}}
    public-url: ${R2_PUBLIC_URL:${IDENTITY_PHOTO_BASE_URL:}}